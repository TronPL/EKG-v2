<!DOCTYPE html>
<html lang="pl">
<body>

<h1>Wyniki analizy EKG</h1>

<p>Wykryte załamki R: {{ r_peak_count }} | Częstotliwość próbkowania: {{ "%.2f"|format(sampling_rate) }} Hz</p>

<img src="{{ plot_url }}" width="1000" alt="Wykres EKG z oznaczonymi zdarzeniami">

<h2>Zdarzenia</h2>

<ul>
{% for e in results %}
    <li>{{ e }}</li>
{% else %}
    <li>Nie wykryto zdarzeń przez obecne reguły analizy.</li>
{% endfor %}
</ul>

<p><a href="{{ url_for('index') }}">Przeanalizuj kolejny plik</a></p>

</body>
</html>
